name: Build FloLabs CRM image

on:
  push:
    branches: [main]
    # Changes that do not affect the image skip the 15-minute build.
    paths-ignore:
      - 'FLOLABS.md'
      - 'packages/twenty-utils/flolabs/**'
      - '.github/workflows/flolabs-deploy.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # The frontend build needs ~8 GB of heap, more than the runner's RAM.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          build-args: |
            APP_VERSION=2.48.1-flolabs
          tags: |
            ghcr.io/flolabsinnovationsgroup/crm:${{ github.sha }}
            ghcr.io/flolabsinnovationsgroup/crm:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
